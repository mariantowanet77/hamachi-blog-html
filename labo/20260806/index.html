<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Lottie 重ねテスト｜Labo｜はまち日和</title>
  <link rel="icon" type="image/svg+xml" href="/assets/common/favicon.svg">
  <link rel="stylesheet" href="/common/style.css">
  <style>
    /* =====================================================================
       ふつうのページ（過去の記事ページと同じ中身）の上に、
       Lottie のアニメを背景透過で重ねて流すテスト。
       ・画面の中央に置く／操作UIは無し
       ・下のページはそのまま読めるし、リンクも押せる（pointer-events: none）
       ===================================================================== */
    #anim {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      /* 画面の短いほうに合わせた正方形。ここを変えれば大きさを調整できる */
      width: min(78vmin, 760px);
      height: min(78vmin, 760px);
      z-index: 50;
      pointer-events: none;   /* 下のページを操作できるように、クリックを通す */
    }
    /* overflow を visible にすると枠の外へ絵が逃げて中央に収まらないので、
       既定（hidden）のままにして表示枠の中に収める */
    #anim svg { display: block; }
  </style>
</head>
<body data-base="/">
  <header class="site-header">
    <div class="site-header__inner">
      <a class="site-title" href="/">はまち日和</a>
      <nav class="site-nav">
        <a class="btn" href="/">ホーム</a>
        <a class="btn btn--primary" href="/pastarticles/">過去の記事</a>
        <a class="btn" href="/about/">このブログについて</a>
      </nav>
    </div>
  </header>

  <!-- アニメの置き場所。中身は lottie が作る -->
  <div id="anim" aria-hidden="true"></div>

  <div class="layout">
    <main class="content">
      <h1>過去の記事</h1>
      <p>これまでに書いた記事の一覧です。記事の追加・管理は <code>common/site.js</code>
         の <code>ARTICLES</code> 配列で行います。</p>
      <div class="card-grid" id="article-manage"></div>
    </main>
    <aside class="sidebar">
      <section class="sidebar__block">
        <h2 class="sidebar__title">過去の記事</h2>
        <ul class="article-list" id="sidebar-articles"></ul>
      </section>
    </aside>
  </div>

  <footer class="site-footer">
    <p class="access-count">あなたは <span id="access-count">—</span> 番目の来訪者です！</p>
    <p class="copyright">© 2026 はまち日和</p>
    <a class="secret-link" href="/secret/">【ひ♡み♡つ】</a>
  </footer>

  <script src="/common/vendor/lottie_light.min.js"></script>
  <script src="/common/site.js"></script>

  <script>
    (function () {
      /* ------- ここをいじれば調整できる（CONFIG） ------- */
      const CONFIG = {
        SRC: '/assets/img/labo/test01.json',

        // Cavalry 側の背景レイヤー名。これを外すと背景が透明になり、
        // 下のページが透けて見える（mp4 ではできなかったところ）
        BG_LAYER: 'Background Shape',

        // この素材は絵がコンポ枠（0,0〜1920,1080）の外、原点まわりに
        // 描かれている。実際に描かれている範囲を測って、そこを表示枠にする。
        // 全フレームを測る（間引くと動きの端を取りこぼして中央がずれる）
        FIT_PADDING: 0.04,   // 余白（描画範囲に対する割合）
      };

      const stage = document.getElementById('anim');
      let anim = null;

      /* ------- 実際に絵が描かれている範囲を測る -------
         数フレーム分の bbox を合体させて「動き全体が収まる矩形」を出す。
         ※ goToAndStop は再生を止めるので、測り終えたら play() し直すこと */
      function measureBox(a) {
        const svg = a.renderer && a.renderer.svgElement;
        if (!svg) return null;
        const total = Math.round(a.totalFrames) || 1;
        let x1 = Infinity, y1 = Infinity, x2 = -Infinity, y2 = -Infinity;

        for (let i = 0; i < total; i++) {
          a.goToAndStop(i, true);
          let b = null;
          try { b = svg.getBBox(); } catch (e) {}
          if (!b || !b.width || !b.height) continue;
          x1 = Math.min(x1, b.x);
          y1 = Math.min(y1, b.y);
          x2 = Math.max(x2, b.x + b.width);
          y2 = Math.max(y2, b.y + b.height);
        }
        if (!isFinite(x1) || x2 <= x1 || y2 <= y1) return null;

        const pad = Math.max(x2 - x1, y2 - y1) * CONFIG.FIT_PADDING;
        return { x: x1 - pad, y: y1 - pad, w: (x2 - x1) + pad * 2, h: (y2 - y1) + pad * 2 };
      }

      fetch(CONFIG.SRC)
        .then(function (res) {
          if (!res.ok) throw new Error('HTTP ' + res.status);
          return res.json();
        })
        .then(function (data) {
          // 背景レイヤーを外して透明にする
          if (Array.isArray(data.layers)) {
            data.layers = data.layers.filter(function (l) { return l.nm !== CONFIG.BG_LAYER; });
          }

          anim = lottie.loadAnimation({
            container: stage,
            renderer: 'svg',
            loop: true,
            autoplay: true,
            animationData: data,
            // meet ＝ 全体が収まるように縮めて中央寄せ（切れない）
            rendererSettings: { preserveAspectRatio: 'xMidYMid meet' },
          });

          anim.addEventListener('DOMLoaded', function () {
            const box = measureBox(anim);
            const svg = anim.renderer && anim.renderer.svgElement;
            if (box && svg) {
              svg.setAttribute('viewBox', box.x + ' ' + box.y + ' ' + box.w + ' ' + box.h);
            }
            anim.play();   // 測定で止まっているので再開する
          });
        })
        .catch(function (e) {
          console.warn('Lottie の読み込みに失敗:', e);
        });
    })();
  </script>
</body>
</html>
