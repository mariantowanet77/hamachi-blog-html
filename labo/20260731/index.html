<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Cavalryを触る｜Labo｜はまち日和</title>
  <link rel="icon" type="image/svg+xml" href="/assets/common/favicon.svg">
  <link rel="stylesheet" href="/common/style.css">
  <!-- 本文を隠す CSS は JS が動くときだけ有効にする。あわせて、万一
       下の script が落ちても本文が出ないまま終わらないよう保険をかけておく -->
  <script>
    document.documentElement.classList.add('js');
    setTimeout(function () {
      var m = document.getElementById('cv-main');
      if (m) m.classList.add('is-revealed');
    }, 9000);
  </script>
  <style>
    /* =====================================================================
       Cavalry で作ったアニメを Lottie で「割り込み」再生するページ
       ・ページを開くと一拍おいて、映像が全画面に“ブツッ”と割り込んでくる
       ・Lottie はループ素材なので「◯周だけ回して閉じる」方式にしている
       ・タイミング類は script 冒頭の CONFIG に集約
       ===================================================================== */
    .cv { background: #05060a; color: #eaf0ff; overflow-x: hidden; }

    /* イントロ再生中は裏のページをスクロールさせない */
    .cv.is-intro-playing { overflow: hidden; }

    /* ---------- 割り込みオーバーレイ ---------- */
    /* #intro 自体は透明。実際に映るのは .intro__screen（黒い画面）のほう。
       こうしておくと「開く前は下のページが見えている」状態を作れる */
    #intro {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: grid;
      place-items: center;
      overflow: hidden;
      cursor: pointer;
    }
    #intro[hidden] { display: none; }

    .intro__screen {
      position: relative;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      transform: scaleY(0.004);          /* 初期状態＝細い一本線 */
      transform-origin: center;
      will-change: transform, filter;
    }
    /* 割り込み：線 → 一気に開く */
    #intro.is-in .intro__screen { animation: cv-cut-in .22s cubic-bezier(.2, .9, .2, 1) forwards; }
    /* 退出：たたんで線に戻り、横に消える */
    #intro.is-out .intro__screen { animation: cv-cut-out .42s cubic-bezier(.7, 0, .3, 1) forwards; }

    @keyframes cv-cut-in {
      0%   { transform: scaleY(0.004) scaleX(1);   filter: brightness(3.2); }
      55%  { transform: scaleY(1.04)  scaleX(1);   filter: brightness(1.35); }
      100% { transform: scaleY(1)     scaleX(1);   filter: brightness(1); }
    }
    @keyframes cv-cut-out {
      0%   { transform: scaleY(1)     scaleX(1);    filter: brightness(1); }
      42%  { transform: scaleY(0.006) scaleX(1);    filter: brightness(3.4); }
      70%  { transform: scaleY(0.006) scaleX(1);    filter: brightness(3.4); }
      100% { transform: scaleY(0.006) scaleX(0);    filter: brightness(3.4); opacity: 0; }
    }

    /* Lottie の描画先。lottie-web が中に <svg> を作る */
    #intro-lottie {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    #intro-lottie svg { display: block; }

    /* 走査線＋ビネット。“信号が割り込んできた”感の味付け（うっすらでOK） */
    .intro__grain {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        repeating-linear-gradient(
          to bottom,
          rgba(255, 255, 255, .035) 0px,
          rgba(255, 255, 255, .035) 1px,
          rgba(0, 0, 0, 0) 1px,
          rgba(0, 0, 0, 0) 3px
        ),
        radial-gradient(120% 120% at 50% 50%, rgba(0, 0, 0, 0) 55%, rgba(0, 0, 0, .45) 100%);
      mix-blend-mode: overlay;
      opacity: .55;
    }

    /* 割り込み前後の白フラッシュ */
    .intro__flash {
      position: fixed;
      inset: 0;
      z-index: 101;
      background: #fff;
      opacity: 0;
      pointer-events: none;
    }
    .intro__flash.is-firing { animation: cv-flash .16s ease-out forwards; }
    @keyframes cv-flash {
      0%   { opacity: .85; }
      100% { opacity: 0; }
    }

    /* スキップ */
    .intro__skip {
      position: absolute;
      z-index: 2;
      right: 20px;
      bottom: 20px;
      padding: 9px 16px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid rgba(255, 255, 255, .3);
      border-radius: 999px;
      background: rgba(8, 12, 22, .45);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      color: #eaf0ff;
      font: inherit;
      font-size: .82rem;
      letter-spacing: .04em;
      cursor: pointer;
      opacity: 0;                          /* 割り込み直後は隠しておく */
      transition: background .2s, border-color .2s, opacity .3s;
    }
    .intro__skip:hover { background: rgba(255, 255, 255, .14); border-color: #fff; }
    .intro__skip.is-shown { opacity: .75; }

    /* ---------- 本文 ---------- */
    .cv .site-header {
      background: rgba(6, 9, 16, .32);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom-color: rgba(255, 255, 255, .08);
    }
    .cv .site-title { color: #fff; }
    .cv .site-title:hover { color: #9fd0ff; }
    .cv .nav-toggle span { background-color: #fff; }
    .cv .nav-toggle span:nth-of-type(1)::before { border-left-color: #fff; }
    .cv .nav-toggle span:nth-of-type(3)::before { border-right-color: #fff; }

    /* 背景の淡いグロー（真っ黒だと寂しいので） */
    .cv::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      background:
        radial-gradient(90% 70% at 18% 8%, rgba(60, 96, 210, .22), transparent 60%),
        radial-gradient(80% 70% at 88% 92%, rgba(150, 84, 220, .18), transparent 62%),
        #05060a;
    }

    .cv-main {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 10vh 24px 96px;
      min-height: calc(100vh - var(--header-h, 76px));
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 20px;
    }
    .cv-main h1 {
      margin: 0;
      font-size: clamp(2.4rem, 8vw, 5rem);
      line-height: 1.05;
      font-weight: 800;
      letter-spacing: .01em;
      background: linear-gradient(120deg, #ffffff, #9fd0ff 55%, #c9a7ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .cv-main p {
      margin: 0;
      max-width: 48ch;
      line-height: 1.9;
      color: rgba(234, 240, 255, .9);
    }
    .cv-note { font-size: .85rem; color: rgba(234, 240, 255, .58); }

    .cv-actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 8px; }
    .cv-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      border: 1px solid rgba(255, 255, 255, .28);
      border-radius: 999px;
      background: rgba(255, 255, 255, .04);
      color: #eaf0ff;
      font: inherit;
      text-decoration: none;
      cursor: pointer;
      transition: background .2s, border-color .2s, transform .2s;
    }
    .cv-btn:hover {
      background: rgba(255, 255, 255, .12);
      border-color: #fff;
      color: #fff;
      text-decoration: none;
      transform: translateY(-2px);
    }

    /* 割り込みが明けたあと、本文をふわっと立ち上げる
       ※ JS が動く環境でだけ隠す（.js ゲート）。JS 無効なら最初から見える */
    .js .cv-reveal > * {
      opacity: 0;
      transform: translateY(18px);
    }
    .cv-main.is-revealed > * {
      animation: cv-rise .6s cubic-bezier(.2, .8, .2, 1) forwards;
    }
    .cv-main.is-revealed > *:nth-child(1) { animation-delay: .02s; }
    .cv-main.is-revealed > *:nth-child(2) { animation-delay: .09s; }
    .cv-main.is-revealed > *:nth-child(3) { animation-delay: .16s; }
    .cv-main.is-revealed > *:nth-child(4) { animation-delay: .23s; }
    .cv-main.is-revealed > *:nth-child(5) { animation-delay: .30s; }
    @keyframes cv-rise {
      to { opacity: 1; transform: translateY(0); }
    }

    /* 「動きを減らす」設定：割り込み演出はやめて、最初から本文を出す */
    @media (prefers-reduced-motion: reduce) {
      .intro__screen,
      #intro.is-in .intro__screen,
      #intro.is-out .intro__screen { animation: none; transform: none; }
      .intro__flash.is-firing { animation: none; }
      .js .cv-reveal > * { opacity: 1; transform: none; }
      .cv-main.is-revealed > * { animation: none; }
    }
  </style>
</head>
<body class="cv" data-base="/">

  <!-- =====================================================================
       割り込みアニメ（Cavalry → Lottie 書き出し）
       ・動画ではないので自動再生ポリシーに引っかからない＝必ず流れる
       ===================================================================== -->
  <div id="intro" hidden>
    <div class="intro__screen">
      <div id="intro-lottie"></div>
      <div class="intro__grain"></div>
    </div>
    <button type="button" class="intro__skip" id="intro-skip">SKIP →</button>
  </div>
  <div class="intro__flash" id="intro-flash"></div>

  <header class="site-header">
    <div class="site-header__inner">
      <a class="site-title" href="/">はまち日和</a>
      <nav class="site-nav">
        <a class="btn" href="/">ホーム</a>
        <a class="btn" href="/pastarticles/">過去の記事</a>
        <a class="btn" href="/about/">このブログについて</a>
      </nav>
    </div>
  </header>

  <main class="cv-main cv-reveal" id="cv-main">
    <h1>Cavalryを触る</h1>
    <p>
      After Effects みたいなモーショングラフィックスのツール「Cavalry」を触ってみた回。
      作ったコンポジションを Lottie で書き出して、ページを開いた瞬間に全画面で割り込ませています。
    </p>
    <p class="cv-note">
      mp4 ではなく Lottie（ベクター）なので、どの解像度でもシャープで、
      自動再生がブロックされることもありません。クリック／Esc でスキップできます。
    </p>
    <div class="cv-actions">
      <button type="button" class="cv-btn" id="cv-replay">▶ もう一度割り込ませる</button>
      <a class="cv-btn" href="/labo/">← Labo に戻る</a>
    </div>
  </main>

  <script src="/common/vendor/lottie_light.min.js"></script>
  <script src="/common/site.js"></script>

  <!-- =====================================================================
       割り込みの進行管理
       ・JSON 読み込み → 一拍おく → フラッシュ＆カットイン → ◯周再生 → カットアウト
       ・読み込めない場合は黙って本文だけ見せる（固まらせない）
       ===================================================================== -->
  <script>
    (function () {
      const intro   = document.getElementById('intro');
      const box     = document.getElementById('intro-lottie');
      const flash   = document.getElementById('intro-flash');
      const skipBtn = document.getElementById('intro-skip');
      const main    = document.getElementById('cv-main');
      const replay  = document.getElementById('cv-replay');

      /* ------- ここをいじれば調整できる（CONFIG） ------- */
      const CONFIG = {
        SRC: '/assets/img/labo/Composition%201.json',

        // この素材は「約43フレームで1周するループ」。全249フレームは同じ動きの
        // 約5回分なので、最後まで流さずに ◯周だけ回して閉じる。
        CYCLE_FRAMES: 43,   // 1周のフレーム数
        CYCLES: 1,          // 何周まわしてから閉じるか（2 にすると約3.4秒）

        // Cavalry 側の背景レイヤー名。ここに名前を入れるとその層を捨てて
        // 「背景が透明なアニメ」として重ねられる（下のページが透ける）。
        // null にすると Cavalry で作ったままの見た目（背景あり）で出る。
        STRIP_LAYER: null,  // 例: 'Background Shape'

        BEAT_BEFORE: 260,   // 割り込む前に本文を見せておく時間(ms)。“不意打ち”感の素
        LOAD_TIMEOUT: 2500, // JSON の読み込みを待つ上限(ms)
        CUT_OUT: 420,       // カットアウトの尺(ms) ※CSS の cv-cut-out と揃える
        SKIP_AFTER: 700,    // SKIP ボタンを出すまでの時間(ms)
        SAFETY_MARGIN: 1500,// 完了イベントが来ないときの保険(ms)
      };

      const reduce = window.matchMedia &&
        window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      let anim = null;
      let endTimer = null;
      let finished = false;

      function reveal() { main.classList.add('is-revealed'); }

      // 白フラッシュを1回焚く（連続で焚けるようアニメを付け直す）
      function fire(el) {
        el.classList.remove('is-firing');
        void el.offsetWidth;      // リフローを挟んでアニメをリセット
        el.classList.add('is-firing');
      }

      /* ------- 本文を出して終了 ------- */
      function finish(withFlash) {
        if (finished) return;
        finished = true;
        clearTimeout(endTimer);
        skipBtn.classList.remove('is-shown');

        if (withFlash) fire(flash);

        intro.classList.remove('is-in');
        intro.classList.add('is-out');
        document.body.classList.remove('is-intro-playing');
        reveal();

        // アニメーションが終わったら完全に取り除く（裏のクリックを邪魔しない）
        setTimeout(function () {
          intro.hidden = true;
          if (anim) anim.pause();
        }, CONFIG.CUT_OUT);
      }

      /* ------- 画面比率に合わせて cover / contain を切り替える ------- */
      function fitSvg() {
        const svg = anim && anim.renderer && anim.renderer.svgElement;
        if (!svg) return;
        // 横長は画面を埋める(slice=cover)、縦長は構図優先(meet=contain)
        const portrait = window.innerWidth / window.innerHeight < 1;
        svg.setAttribute('preserveAspectRatio', portrait ? 'xMidYMid meet' : 'xMidYMid slice');
      }
      window.addEventListener('resize', fitSvg);

      /* ------- 割り込み開始 ------- */
      function start() {
        if (!anim) return;
        finished = false;
        intro.hidden = false;
        intro.classList.remove('is-out');
        document.body.classList.add('is-intro-playing');

        // 一本線 → バッ と開く。フラッシュも同時に焚いて“割り込んだ”感を出す
        fire(flash);
        intro.classList.add('is-in');

        // 0 〜（1周 × 周回数）だけ再生して止める
        const last = CONFIG.CYCLE_FRAMES * CONFIG.CYCLES;
        anim.setLoop(false);
        anim.playSegments([0, last], true);

        // complete が来なかった場合の保険
        const ms = (last / (anim.frameRate || 25)) * 1000;
        clearTimeout(endTimer);
        endTimer = setTimeout(function () { finish(true); }, ms + CONFIG.SAFETY_MARGIN);

        setTimeout(function () {
          if (!finished) skipBtn.classList.add('is-shown');
        }, CONFIG.SKIP_AFTER);
      }

      /* ------- Lottie の読み込み ------- */
      function boot() {
        if (reduce) { reveal(); return; }   // 動きを減らす設定なら割り込みなし

        let settled = false;
        const giveUp = function () {
          if (settled) return;
          settled = true;
          reveal();                          // 素材が来なくても本文は見せる
        };
        const timer = setTimeout(giveUp, CONFIG.LOAD_TIMEOUT);

        fetch(CONFIG.SRC)
          .then(function (res) {
            if (!res.ok) throw new Error('HTTP ' + res.status);
            return res.json();
          })
          .then(function (data) {
            if (settled) return;             // 待ちきれずに本文を出した後だった
            clearTimeout(timer);
            settled = true;

            // 背景レイヤーを捨てる指定があれば外す（透過して重ねたいとき用）
            if (CONFIG.STRIP_LAYER && Array.isArray(data.layers)) {
              data.layers = data.layers.filter(function (l) {
                return l.nm !== CONFIG.STRIP_LAYER;
              });
            }

            anim = lottie.loadAnimation({
              container: box,
              renderer: 'svg',
              loop: false,
              autoplay: false,
              animationData: data,
              rendererSettings: { preserveAspectRatio: 'xMidYMid slice' },
            });

            anim.addEventListener('complete', function () { finish(true); });
            anim.addEventListener('DOMLoaded', function () {
              fitSvg();
              setTimeout(start, CONFIG.BEAT_BEFORE);
            });
          })
          .catch(function (e) {
            console.warn('Lottie の読み込みに失敗:', e);
            clearTimeout(timer);
            giveUp();
          });
      }

      /* ------- イベント ------- */
      skipBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        finish(false);
      });
      // 画面のどこを触ってもスキップ
      intro.addEventListener('click', function () { finish(false); });
      document.addEventListener('keydown', function (e) {
        if (intro.hidden) return;
        if (e.key === 'Escape' || e.key === ' ' || e.key === 'Enter') {
          e.preventDefault();
          finish(false);
        }
      });

      // もう一度割り込ませる
      replay.addEventListener('click', function () {
        if (!intro.hidden) return;
        start();
      });

      boot();
    })();
  </script>
</body>
</html>
